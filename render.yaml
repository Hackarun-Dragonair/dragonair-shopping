services:
  - type: web
    name: ronda-viva
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 1 wsgi:app
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: SEED_ON_START
        value: "1"
      - key: SECRET_KEY
        generateValue: true
